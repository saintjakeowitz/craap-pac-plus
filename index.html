<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flight of the InfoLit — Single-File</title>
<meta name="description" content="A whimsical, accessible info-literacy mini-game suite for libraries." />
<meta name="theme-color" content="#940731" />
<!-- No external fonts, no analytics, no trackers. System font stack only. -->

<style>
  :root{
    /* Brand tokens */
    --crimson:#940731;
    --pink-a:#db4a6a;
    --pink-b:#d54264;
    --pink-c:#da4969;
    --white:#ffffff;
    --ink:#111111;

    /* A11y / layout */
    --bg:#fff;
    --fg:#111;
    --muted:#333;
    --focus:#111; /* high-contrast outline; color not sole cue */
    --radius:16px;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;

    /* Sizing */
    --maxw:960px;
  }

  @media (prefers-color-scheme: dark){
    :root{ --bg:#111; --fg:#fff; --muted:#cfcfcf; --focus:#fff; }
    body { background:#111; color:#fff; }
  }

  html,body{height:100%}
  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    background: var(--bg);
    color: var(--fg);
    line-height:1.45;
  }

  .wrap{max-width:var(--maxw); margin:auto; padding: var(--space-6) var(--space-4)}
  .sr-only{position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden}
  .btn{
    appearance:none; border:2px solid var(--crimson); background:var(--crimson); color:#fff;
    padding:10px 14px; border-radius:999px; cursor:pointer; font-weight:700;
  }
  .btn.secondary{ background:transparent; color:var(--crimson);}
  .btn.ghost{ border-color:var(--pink-a); color:var(--pink-a); background:transparent; }
  .btn:focus-visible{ outline:3px dashed var(--focus); outline-offset:2px }
  .btn[disabled]{ opacity:.6; cursor:not-allowed }
  .btn.ghost.selected{ outline:3px dashed var(--focus); outline-offset:2px; }

  .hud{
    display:flex; flex-wrap:wrap; gap:var(--space-3); align-items:center; justify-content:space-between;
    padding:var(--space-3) var(--space-4); border:1px solid var(--pink-b); border-radius:var(--radius);
    background: linear-gradient(180deg, rgba(148,7,49,.12), rgba(219,74,106,.07));
  }
  .hud .stat{ display:flex; gap:8px; align-items:center; font-weight:700 }
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px;
    border:2px solid var(--pink-a); background:rgba(219,74,106,.08); margin:4px 6px; cursor:pointer; user-select:none;
  }
  .chip[aria-pressed="true"]{ background:var(--pink-a); color:#fff }
  .chip:focus-visible{ outline:3px dashed var(--focus) }

  .card{ border:1px solid var(--pink-b); border-radius:var(--radius); padding:var(--space-5); background:rgba(255,255,255,.6) }
  @media (prefers-color-scheme: dark){ .card{ background:rgba(0,0,0,.35)}}

  .grid{ display:grid; gap:var(--space-4)}
  .grid.cols-2{ grid-template-columns:1fr; }
  @media(min-width:720px){ .grid.cols-2{ grid-template-columns:1fr 1fr } }

  .deco{
    /* Art-deco geometric frame using layered gradients */
    border-radius:var(--radius); padding:var(--space-5); position:relative; overflow:hidden;
    background:
      conic-gradient(from 90deg at 10% 10%, transparent 0 25%, rgba(148,7,49,.12) 0 50%, transparent 0 100%),
      conic-gradient(from 270deg at 90% 90%, transparent 0 25%, rgba(219,74,106,.12) 0 50%, transparent 0 100%);
    border:2px solid var(--crimson);
  }

  .title{
    display:flex; align-items:center; justify-content:center; gap:12px; text-align:center;
    font-weight:900; letter-spacing:.04em; text-transform:uppercase; font-size: clamp(20px, 4.5vw, 36px);
    color:var(--crimson);
  }

  /* Airplane SVG badge */
  .plane{ width:32px; height:32px; }
  .plane svg{ display:block }

  .choices, .dropzones{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px }
  .dropzone{
    flex:1 1 220px; min-height:86px; border:2px dashed var(--pink-c); border-radius:12px; padding:10px;
  }
  .dropzone h4{ margin:.25rem 0 .5rem 0 }
  .pill{
    border:2px solid var(--pink-c); border-radius:999px; padding:6px 10px; cursor:grab; display:inline-block;
    background:rgba(218,73,105,.08)
  }
  .pill:focus-visible{ outline:3px dashed var(--focus) }
  .pill[data-selected="true"]{ box-shadow:0 0 0 3px var(--focus) inset; }

  .kbd{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; background:#0002; border:1px solid #0003; padding:2px 6px; border-radius:6px }

  .muted{ color:var(--muted) }

  .dialog-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center;
  }
  .dialog{
    max-width:680px; width:95%; background:var(--bg); color:var(--fg);
    border-radius:16px; border:2px solid var(--pink-b); padding:20px;
  }

  .progress{
    width:100%; height:10px; border-radius:999px; background:#0001; overflow:hidden; border:1px solid #0003
  }
  .progress > div{ height:100%; background:linear-gradient(90deg, var(--crimson), var(--pink-a)); width:0% }

  .notice{ padding:12px 14px; border-left:6px solid var(--pink-a); background:rgba(219,74,106,.08); border-radius:8px }

  .footer-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:flex-end }

  /* Focus visible outlines for interactive elements globally */
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:3px dashed var(--focus); outline-offset:2px;
  }

  /* Reduced motion: disable transitions/animations */
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite">
  <header class="deco" role="banner" aria-label="Game header">
    <h1 class="title">
      <span class="plane" aria-hidden="true">
        <!-- Inline art-deco airplane (brand colors) -->
        <svg viewBox="0 0 64 64" role="img" aria-label="Crimson airplane">
          <path fill="#940731" d="M3 36l20-6 6-20c.6-2.1 3.6-2.1 4.2 0l6 20 20 6c2.1.6 2.1 3.6 0 4.2l-20 6-6 20c-.6 2.1-3.6 2.1-4.2 0l-6-20-20-6c-2.1-.6-2.1-3.6 0-4.2z"/>
          <circle cx="32" cy="32" r="4" fill="#db4a6a"/>
        </svg>
      </span>
      Flight of the InfoLit
      <span class="plane" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path fill="#da4969" d="M3 36l20-6 6-20c.6-2.1 3.6-2.1 4.2 0l6 20 20 6c2.1.6 2.1 3.6 0 4.2l-20 6-6 20c-.6 2.1-3.6 2.1-4.2 0l-6-20-20-6c-2.1-.6-2.1-3.6 0-4.2z"/></svg>
      </span>
    </h1>
    <p class="muted" id="tagline">Welcome aboard, researcher. Please keep your curiosity in the upright and locked position. 🍬✈️</p>
  </header>

  <div id="screen"></div>
</div>

<!-- Accessible modal (Teach Me / Hints / Admin) -->
<div class="dialog-backdrop" id="modal-backdrop" role="none">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
    <h2 id="modal-title" class="title" style="font-size:22px">Dialog</h2>
    <div id="modal-desc"></div>
    <div class="footer-actions" style="margin-top:16px">
      <button class="btn" id="modal-close" aria-label="Close dialog">Close</button>
    </div>
  </div>
</div>

<!-- =========================
     INLINE GAME CONTENT JSON
     (must be valid JSON; no comments)
     ========================= -->
<script type="application/json" id="game-content">
{
  "meta": {
    "version": "1.0.0",
    "title": "Flight of the InfoLit",
    "secretSalt": "VLUC-🍬-ArtDeco-✈️-2025"
  },
  "settings": {
    "enabledLevels": ["keywords","boolean","source-sort","database-match","evaluation","lightning"],
    "difficulty": "Standard",
    "timerSec": { "Easy": 900, "Standard": 780, "Challenging": 600 },
    "hintPenalty": 2,
    "correctReward": 10,
    "timeBonusMax": 30,
    "assessmentMode": false,
    "attemptsPerLevel": 2
  },
  "levels": [
    {
      "id": "keywords",
      "title": "Build Better Keywords",
      "type": "chips",
      "tips": [
        "Start broad, then narrow with AND.",
        "Use OR to include synonyms.",
        "Truncate with * to include variant endings (e.g., psycholog*).",
        "Avoid natural language—think in concepts & synonyms."
      ],
      "prompts": [
        {
          "topic": "How did the treatment of mental illness change from the early 1900s to the late 1900s?",
          "target": ["\"mental illness\"","treatment","(asylum OR institutionalization)","(deinstitutionalization OR \"community care\")","(\"1900s\" OR \"20th century\")"],
          "synonyms": [["asylum","institution","institutionalization"],["therapy","treatment","intervention"],["community care","deinstitutionalization"]],
          "good_queries": [
            "\"mental illness\" AND treatment AND (asylum OR institutionalization) AND (deinstitutionalization OR \"community care\") AND (\"1900s\" OR \"20th century\")"
          ],
          "chips": ["mental health","\"mental illness\"","treatment","therapy","asylum","institutionalization","deinstitutionalization","community care","\"1900s\"","\"20th century\"","policy","United States"]
        },
        {
          "topic": "Impact of social media on adolescent sleep quality.",
          "target": ["\"social media\"","adolescen*","sleep","(quality OR duration)"],
          "synonyms": [["teen*","youth","adolescen*"],["sleep","sleep quality","sleep duration"]],
          "good_queries": [
            "\"social media\" AND adolescen* AND (sleep AND (quality OR duration))"
          ],
          "chips": ["\"social media\"","teen*","youth","adolescen*","sleep","sleep quality","sleep duration","circadian","screen time"]
        },
        {
          "topic": "Effects of microplastics on marine invertebrates.",
          "target": ["microplastic*","marine","invertebrate*","(toxic* OR ingestion)"],
          "synonyms": [["ocean","marine"],["invertebrate*","bivalve*","crustacean*"]],
          "good_queries": [
            "microplastic* AND marine AND invertebrate* AND (toxic* OR ingestion)"
          ],
          "chips": ["microplastic*","marine","ocean","invertebrate*","bivalve*","crustacean*","toxicity","ingestion","exposure"]
        }
      ]
    },
    {
      "id": "boolean",
      "title": "Boolean Flight Plan",
      "type": "boolean",
      "tips": [
        "AND narrows, OR broadens, NOT excludes.",
        "Group synonyms with ( ) to control logic.",
        "Put phrases in \"quotes\" to keep words together."
      ],
      "questions": [
        {
          "stem": "You need articles on college athletes and mental health, but not about professional leagues.",
          "answer": "\"college athletes\" AND \"mental health\" NOT professional"
        },
        {
          "stem": "Broaden results about renewable energy cars: electric OR hybrid, but avoid motorcycles.",
          "answer": "(electric OR hybrid) AND cars NOT motorcycles"
        },
        {
          "stem": "Find items on climate change risk assessment, grouping synonyms.",
          "answer": "\"climate change\" AND (risk OR hazard) AND assessment"
        }
      ]
    },
    {
      "id": "source-sort",
      "title": "Sort the Sources",
      "type": "sort",
      "tips": [
        "Primary sources = original, first-hand (e.g., diaries, datasets).",
        "Secondary = analysis/commentary about primary sources.",
        "Scholarly vs. Popular: peer review, citations, formal tone vs. accessible, ads."
      ],
      "buckets": ["Primary","Secondary","Scholarly","Popular"],
      "cards": [
        {"text":"A 1968 patient diary from a state hospital.","bucket":"Primary"},
        {"text":"A meta-analysis of clinical trials in The Lancet.","bucket":"Scholarly"},
        {"text":"A New York Times article on community mental health centers.","bucket":"Popular"},
        {"text":"Digitized census dataset (1900–1950).","bucket":"Primary"},
        {"text":"A book chapter interpreting WWII letters.","bucket":"Secondary"},
        {"text":"Peer-reviewed article reporting new field data.","bucket":"Scholarly"}
      ]
    },
    {
      "id": "database-match",
      "title": "Database Matchmaking",
      "type": "match",
      "tips": [
        "JSTOR: humanities, older coverage, stable PDFs; great for phrase search & date filters.",
        "PubMed: biomedical/health; MeSH terms help.",
        "PsycINFO: psychology/behavior, strong subject indexing.",
        "Primo VE: books, media, many databases at once; use Advanced Search fields."
      ],
      "pairs": [
        {"topic":"Philosophy of embodiment in Merleau-Ponty","db":"JSTOR"},
        {"topic":"Clinical trials on SSRI efficacy","db":"PubMed"},
        {"topic":"Cognitive-behavioral therapy in adolescents","db":"PsycINFO"},
        {"topic":"Find if Lewis owns 'Phenomenology of Perception'","db":"Primo VE"}
      ]
    },
    {
      "id": "evaluation",
      "title": "CRAAP/RADAR Check",
      "type": "quiz",
      "tips": [
        "Currency: is it up-to-date for the field?",
        "Relevance/Authority: audience and author credentials.",
        "Accuracy/Purpose: evidence, citations, bias disclaimers."
      ],
      "items": [
        {
          "prompt":"A blog post (2021) by a PhD sleep researcher summarizing their peer-reviewed study; cites the journal article; no ads.",
          "options":["Likely credible","Likely not credible"],
          "answer":0,
          "why":"Clear credentials, citations, and low bias indicators."
        },
        {
          "prompt":"A site selling supplements claims 'microplastics cure!' with no citations; heavy product links.",
          "options":["Likely credible","Likely not credible"],
          "answer":1,
          "why":"Commercial bias, extraordinary claim without evidence."
        },
        {
          "prompt":"A 1994 pop-magazine piece predicting the internet will end libraries by 2000.",
          "options":["Likely credible","Likely not credible"],
          "answer":1,
          "why":"Outdated and inaccurate; weak authority."
        },
        {
          "prompt":"Peer-reviewed article in 2019 reporting methods and data.",
          "options":["Likely credible","Likely not credible"],
          "answer":0,
          "why":"Peer review, transparency, date acceptable."
        }
      ]
    },
    {
      "id": "lightning",
      "title": "Lightning Round",
      "type": "signals",
      "tips": [
        "Peer-review signals: 'Received/Accepted' dates, DOI, references.",
        "Citation basics: author, title, source, year; permalinks/DOIs preferred.",
        "Broken links? Use the library link resolver or Primo 'Find It'."
      ],
      "signals": [
        {"q":"Which is a strong sign of peer review?","choices":["A DOI and reference list","Stock photos and pop-up ads","Anonymous author"],"answer":0,"why":"DOIs and reference lists are common in scholarly articles."},
        {"q":"Best element to copy for a citation?","choices":["The URL bar copy of a long session link","The DOI or permalink","The headline font style"],"answer":1,"why":"Permalinks/DOIs are stable; session URLs break."},
        {"q":"You find a 404 on a scholarly article link. First move?","choices":["Give up and go nap","Try Primo 'Find It' or the journal title search","Email the author memes"],"answer":1,"why":"Link resolvers/journal search often locate full text."}
      ]
    }
  ]
}
</script>

<!-- Load external JS (must exist at repo root as app.js) -->
<script src="app.js" defer></script>
</body>
</html>
